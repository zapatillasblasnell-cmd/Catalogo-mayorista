<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Virtual y Catálogo Mayorista</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: 'var(--color-primary, #e11d48)',
              redDark: 'var(--color-primary-hover, #be123c)',
              gold: '#f59e0b',
              navy: '#0f172a'
            }
          },
          animation: {
            'badge-shine': 'shine 2.8s infinite',
            'subtle-pulse': 'subtlePulse 2.5s infinite ease-in-out',
            'cart-bounce': 'cartBounce 0.45s ease-out'
          },
          keyframes: {
            shine: {
              '0%': { transform: 'translateX(-100%)' },
              '35%, 100%': { transform: 'translateX(200%)' }
            },
            subtlePulse: {
              '0%, 100%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.025)' }
            },
            cartBounce: {
              '0%, 100%': { transform: 'scale(1)' },
              '40%': { transform: 'scale(1.22)' },
              '75%': { transform: 'scale(0.92)' }
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-primary: #e11d48;
      --color-primary-hover: #be123c;
      --color-accent: #ffe4e6;
    }
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #f1f5f9;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .dynamic-bg-primary { background-color: var(--color-primary, #e11d48) !important; }
    .dynamic-text-primary { color: var(--color-primary, #e11d48) !important; }
    .dynamic-border-primary { border-color: var(--color-primary, #e11d48) !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex justify-center selection:bg-rose-600 selection:text-white">

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="w-full max-w-[430px] md:max-w-3xl lg:max-w-5xl xl:max-w-6xl bg-white min-h-screen flex flex-col shadow-2xl relative overflow-x-hidden pb-24 md:my-6 md:rounded-3xl md:border md:border-slate-200">

    <!-- CABECERA PRINCIPAL SUPERIOR -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 md:px-8 py-3 transition">
      <div class="flex items-center justify-between">
        <button type="button" onclick="openSidebarMenu()" class="w-10 h-10 flex items-center justify-center rounded-xl text-slate-700 hover:bg-slate-100 active:scale-95 transition" aria-label="Menú principal">
          <i data-lucide="menu" class="w-6 h-6 stroke-[2.2]"></i>
        </button>

        <div id="headerLogoWrapper" onclick="handleLogoSecretClicks()" class="flex-1 max-w-[210px] md:max-w-[280px] h-10 md:h-12 flex items-center justify-center mx-2 cursor-pointer group" title="Toca 4 veces para Administrador">
          <img id="headerLogoImg" src="" alt="Logotipo" class="max-h-full max-w-full object-contain hidden transition-transform group-hover:scale-105" />
          <div id="headerLogoFallback" class="border border-slate-300 px-5 py-1.5 rounded-sm tracking-[0.35em] text-xs md:text-sm font-black uppercase text-slate-900 group-hover:border-slate-800 transition">
            L O G O
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <button type="button" onclick="openCartModal()" class="w-10 h-10 flex items-center justify-center rounded-xl text-slate-800 hover:bg-slate-100 active:scale-95 transition relative" aria-label="Ver pedido">
            <i data-lucide="shopping-cart" class="w-6 h-6 stroke-[2.2]"></i>
            <span id="headerCartBadge" class="absolute top-1 right-1 dynamic-bg-primary text-white text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-xs hidden">0</span>
          </button>
        </div>
      </div>
    </header>

    <!-- CARRUSEL HERO 1:1 -->
    <section class="relative w-full aspect-square md:aspect-[16/9] lg:aspect-[21/9] bg-slate-100 overflow-hidden select-none">
      <div id="heroSlidesContainer" class="w-full h-full relative"></div>
      <div id="heroDotsWrapper" class="absolute bottom-3 left-0 right-0 flex items-center justify-center space-x-1.5 z-20 pointer-events-none"></div>
      <button type="button" onclick="prevHeroSlide()" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 md:w-11 md:h-11 rounded-full bg-black/35 text-white flex items-center justify-center backdrop-blur-xs hover:bg-black/60 transition z-20" aria-label="Foto anterior">
        <i data-lucide="chevron-left" class="w-5 h-5 md:w-6 md:h-6"></i>
      </button>
      <button type="button" onclick="nextHeroSlide()" class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 md:w-11 md:h-11 rounded-full bg-black/35 text-white flex items-center justify-center backdrop-blur-xs hover:bg-black/60 transition z-20" aria-label="Siguiente foto">
        <i data-lucide="chevron-right" class="w-5 h-5 md:w-6 md:h-6"></i>
      </button>
    </section>

    <!-- PASTILLA PROMOCIONAL -->
    <section class="px-3 md:px-8 pt-4 pb-1">
      <div id="promoBadgeCard" class="relative overflow-hidden rounded-2xl dynamic-bg-primary text-white shadow-md shadow-rose-600/30 border border-white/20 px-3 md:px-6 py-2.5 flex items-center justify-center">
        <div class="absolute inset-0 w-1/3 bg-gradient-to-r from-transparent via-white/30 to-transparent skew-x-12 animate-badge-shine pointer-events-none"></div>
        <div class="flex items-center space-x-2 text-center overflow-hidden">
          <span class="w-2 h-2 rounded-full bg-white shrink-0 animate-ping"></span>
          <span id="promoBadgeNoticeText" class="text-[10.5px] sm:text-xs md:text-sm font-black uppercase tracking-wider whitespace-nowrap truncate drop-shadow-xs">
            ZAPATILLAS DE NIÑOS IMPORTADAS AL POR MAYOR
          </span>
        </div>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="px-3 md:px-8 pt-3 pb-2 space-y-3 bg-gradient-to-b from-slate-50/80 to-white border-y border-slate-100">
      <div class="space-y-1">
        <div class="flex items-center justify-between px-0.5">
          <div class="flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full dynamic-bg-primary animate-pulse"></span>
            <span class="text-[11px] md:text-xs font-extrabold uppercase tracking-wider text-slate-700">Filtrar por Tallas / Series</span>
          </div>
          <span class="text-[9px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest">Desliza o haz clic 👉</span>
        </div>
        <div id="seriesChipsContainer" class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1 px-0.5"></div>
      </div>

      <div class="space-y-1">
        <div class="flex items-center justify-between px-0.5">
          <div class="flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full bg-slate-800"></span>
            <span class="text-[11px] md:text-xs font-extrabold uppercase tracking-wider text-slate-700">Filtrar por Estilo</span>
          </div>
        </div>
        <div id="styleChipsContainer" class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1 px-0.5"></div>
      </div>

      <div id="filterStatusRow" class="flex items-center justify-between text-[11px] font-semibold text-slate-500 pt-0.5 px-0.5 hidden">
        <span id="filterStatusLabel" class="flex items-center space-x-1.5 text-slate-800 font-bold bg-slate-100 px-3 py-1 rounded-full text-[10px] md:text-xs">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
          <span id="filterAppliedText">Filtros aplicados</span>
        </span>
        <button type="button" onclick="resetAllCatalogFilters()" class="dynamic-text-primary font-black hover:underline flex items-center space-x-1 bg-rose-50 hover:bg-rose-100 px-3 py-1 rounded-full text-[10px] md:text-xs transition active:scale-95 shadow-2xs">
          <span>Limpiar filtros</span>
          <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
        </button>
      </div>
    </section>

    <!-- CATÁLOGO DINÁMICO -->
    <main id="catalogSectionsContainer" class="space-y-8 pt-3 px-3 md:px-8"></main>

    <!-- ESTADO VACÍO -->
    <div id="emptyCatalogBox" class="hidden py-16 px-4 text-center space-y-3">
      <div class="w-16 h-16 rounded-full bg-slate-100 text-slate-400 mx-auto flex items-center justify-center">
        <i data-lucide="package-x" class="w-8 h-8"></i>
      </div>
      <p class="text-sm font-bold text-slate-800">No hay modelos con este filtro</p>
      <button type="button" onclick="resetAllCatalogFilters()" class="bg-slate-900 text-white text-xs font-bold py-2.5 px-5 rounded-xl hover:bg-slate-800 active:scale-95 transition">
        Ver todo el catálogo
      </button>
    </div>

    <!-- FOOTER -->
    <footer class="mt-12 border-t border-slate-100 px-4 md:px-8 pt-6 pb-8 space-y-5 bg-white">
      <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 md:p-6 space-y-2.5 md:space-y-0 md:grid md:grid-cols-3 md:gap-4 text-xs md:text-sm text-slate-700 shadow-2xs">
        <div class="flex items-center space-x-2.5">
          <i data-lucide="map-pin" class="w-4 h-4 text-slate-500 shrink-0"></i>
          <span id="footerLocationText" class="font-medium">Lima, Perú — Envíos a todo el país</span>
        </div>
        <div class="flex items-center space-x-2.5">
          <i data-lucide="clock" class="w-4 h-4 text-slate-500 shrink-0"></i>
          <span id="footerHoursText" class="font-medium">Lunes a Sábado: 9:00 am – 8:00 pm</span>
        </div>
        <div class="flex items-center space-x-2.5">
          <i data-lucide="message-circle" class="w-4 h-4 text-emerald-600 shrink-0"></i>
          <span class="font-semibold text-slate-900">WhatsApp: <span id="footerPhoneText" class="font-bold text-emerald-700">+51997857379</span></span>
        </div>
      </div>
    </footer>
  </div>

  <!-- PASTILLA FLOTANTE INFERIOR -->
  <div id="bottomWholesaleBar" class="fixed bottom-3 md:bottom-6 left-1/2 -translate-x-1/2 w-[94%] max-w-[420px] md:max-w-md z-[65] bg-white/95 backdrop-blur-md border border-slate-200/90 rounded-
